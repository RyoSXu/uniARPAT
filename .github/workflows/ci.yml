name: Static contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and static-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
      - name: Run cache-free static contracts
        run: bash tools/ci/check-static.sh
